name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

# A newer push to the same branch cancels the run that is still going
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-and-unit-tests:
    name: Lint + unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements-dev.txt
            generator/requirements.txt
            dashboard/requirements.txt

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Lint (ruff)
        run: ruff check .

      - name: Unit tests
        run: pytest -v   # database tests skip themselves here

  pipeline:
    name: End-to-end pipeline (generator -> dbt -> dashboard)
    runs-on: ubuntu-latest
    needs: lint-and-unit-tests

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: energy
          POSTGRES_PASSWORD: energy_pw
          POSTGRES_DB: energy
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U energy -d energy"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      POSTGRES_HOST: localhost
      POSTGRES_PORT: "5432"
      POSTGRES_USER: energy
      POSTGRES_PASSWORD: energy_pw
      POSTGRES_DB: energy
      DBT_PROFILES_DIR: ${{ github.workspace }}/dbt
      DBT_SEND_ANONYMOUS_USAGE_STATS: "false"

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements-dev.txt
            generator/requirements.txt
            dashboard/requirements.txt

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Generate 30 days of meter reads into bronze
        run: python generator/generate_meter_reads.py --days 30

      - name: Catch-up load is a no-op when bronze is current (safe to rerun)
        run: python generator/generate_meter_reads.py --catch-up | tee catchup.log && grep -q "Nothing to load" catchup.log

      - name: dbt build (seeds, models, tests)
        working-directory: dbt
        run: dbt build

      - name: dbt source freshness
        working-directory: dbt
        run: dbt source freshness

      - name: Dashboard renders against gold
        run: pytest -v tests/test_dashboard.py

      - name: Load 2 more days (new data for an incremental run)
        run: python generator/generate_meter_reads.py --days 2

      - name: "SCD Type 2: upgrade Sunfield Solar from 50 to 60 MW"
        run: sed -i 's/^STN-SOL-01,Sunfield Solar,solar,50$/STN-SOL-01,Sunfield Solar,solar,60/' dbt/seeds/stations.csv

      - name: Incremental models match a full rebuild exactly
        env:
          PGHOST: localhost
          PGUSER: energy
          PGPASSWORD: energy_pw
          PGDATABASE: energy
        run: |
          command -v psql || (sudo apt-get update && sudo apt-get install -y postgresql-client)
          scripts/verify_incremental.sh

      - name: "SCD Type 2: history kept, capacity applied point-in-time"
        env:
          PGHOST: localhost
          PGUSER: energy
          PGPASSWORD: energy_pw
          PGDATABASE: energy
        run: |
          versions=$(psql -qXtA -c "select count(*) from gold.dim_stations where station_id = 'STN-SOL-01'")
          capacities=$(psql -qXtA -c "select string_agg(distinct capacity_mw::text, ',' order by capacity_mw::text) from gold.gold_daily_generation where station_id = 'STN-SOL-01'")
          echo "versions=$versions capacities_used=$capacities"
          test "$versions" = "2" && test "$capacities" = "50,60"

  airflow-dag:
    name: Airflow DAG loads and has the right shape
    runs-on: ubuntu-latest
    needs: lint-and-unit-tests
    env:
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install Airflow (official constraints) + pytest
        run: |
          pip install "apache-airflow[postgres]==3.3.2" pytest==9.1.1 \
            --constraint "https://raw.githubusercontent.com/apache/airflow/constraints-3.3.2/constraints-3.12.txt"

      - name: DAG tests
        run: pytest -v tests/test_dag.py

  docker-build:
    name: Docker images build
    runs-on: ubuntu-latest
    needs: lint-and-unit-tests
    steps:
      - uses: actions/checkout@v7

      - name: Build all images
        run: |
          cp .env.example .env
          docker compose --profile tools build
