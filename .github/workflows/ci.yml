name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

# A newer push to the same branch cancels the run that is still going
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-and-unit-tests:
    name: Lint + unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements-dev.txt
            generator/requirements.txt
            dashboard/requirements.txt

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Lint (ruff)
        run: ruff check .

      - name: Unit tests
        run: pytest -v   # database tests skip themselves here

  pipeline:
    name: End-to-end pipeline (generator -> dbt -> dashboard)
    runs-on: ubuntu-latest
    needs: lint-and-unit-tests

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: energy
          POSTGRES_PASSWORD: energy_pw
          POSTGRES_DB: energy
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U energy -d energy"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      POSTGRES_HOST: localhost
      POSTGRES_PORT: "5432"
      POSTGRES_USER: energy
      POSTGRES_PASSWORD: energy_pw
      POSTGRES_DB: energy
      DBT_PROFILES_DIR: ${{ github.workspace }}/dbt
      DBT_SEND_ANONYMOUS_USAGE_STATS: "false"

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements-dev.txt
            generator/requirements.txt
            dashboard/requirements.txt

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Generate 30 days of meter reads into bronze
        run: python generator/generate_meter_reads.py --days 30

      - name: Incremental load (continues from the last day)
        run: python generator/generate_meter_reads.py --days 1

      - name: dbt build (seeds, models, tests)
        working-directory: dbt
        run: dbt build

      - name: dbt source freshness
        working-directory: dbt
        run: dbt source freshness

      - name: Dashboard renders against gold
        run: pytest -v tests/test_dashboard.py

  docker-build:
    name: Docker images build
    runs-on: ubuntu-latest
    needs: lint-and-unit-tests
    steps:
      - uses: actions/checkout@v7

      - name: Build all images
        run: |
          cp .env.example .env
          docker compose --profile tools build
