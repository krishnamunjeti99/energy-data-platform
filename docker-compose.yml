services:
  postgres:
    image: postgres:16
    container_name: energy_pg
    # Store and display timestamps in India time by default
    command: ["postgres", "-c", "timezone=Asia/Kolkata"]
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Run on demand:  docker compose run --rm generator --days 30
  generator:
    build: ./generator
    profiles: ["tools"]          # not started by a plain `docker compose up`
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      POSTGRES_HOST: postgres    # the service name on the compose network
      POSTGRES_PORT: "5432"      # container-to-container port, not the host port
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}

  # Run on demand:  docker compose run --rm dbt build
  dbt:
    build: ./dbt
    profiles: ["tools"]
    depends_on:
      postgres:
        condition: service_healthy
    # run as your WSL user so files dbt writes (target/, logs/) stay editable
    user: "${HOST_UID:-1000}:${HOST_GID:-1000}"
    working_dir: /usr/app
    volumes:
      - ./dbt:/usr/app
    ports:
      - "${DBT_DOCS_PORT:-8080}:8080"   # only used by `dbt docs serve`
    environment:
      DBT_PROFILES_DIR: /usr/app
      DBT_SEND_ANONYMOUS_USAGE_STATS: "false"
      HOME: /tmp
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}

  # Long-running web app:  docker compose up -d dashboard  ->  http://localhost:8501
  dashboard:
    build: ./dashboard
    container_name: energy_dashboard
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "${DASHBOARD_PORT:-8501}:8501"
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    restart: unless-stopped

  # One-off helper: creates the "airflow" metadata database in the same Postgres
  airflow-db-init:
    image: postgres:16
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PGHOST: postgres
      PGUSER: ${POSTGRES_USER}
      PGPASSWORD: ${POSTGRES_PASSWORD}
      PGDATABASE: ${POSTGRES_DB}
    entrypoint: ["bash", "-c"]
    command:
      - psql -tAc "select 1 from pg_database where datname = 'airflow'" | grep -q 1 || psql -c "create database airflow"
    restart: "no"

  # Airflow in standalone mode: scheduler, web UI, DAG processor and triggerer in
  # one container (~1.5 GB RAM), metadata in the existing Postgres.
  #   docker compose up -d airflow   ->  http://localhost:8090
  airflow:
    build: ./airflow
    container_name: energy_airflow
    command: standalone
    user: "${HOST_UID:-1000}:0"
    depends_on:
      postgres:
        condition: service_healthy
      airflow-db-init:
        condition: service_completed_successfully
    ports:
      - "${AIRFLOW_PORT:-8090}:8080"
    environment:
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/airflow
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__CORE__PARALLELISM: "2"          # the pipeline runs one task at a time
      AIRFLOW__API__WORKERS: "1"
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
      AIRFLOW__CORE__DEFAULT_TIMEZONE: Asia/Kolkata
      AIRFLOW__CORE__SIMPLE_AUTH_MANAGER_ALL_ADMINS: "true"   # local dev: no login
      # Airflow connection used by the check_gold task
      AIRFLOW_CONN_ENERGY_WAREHOUSE: '{"conn_type": "postgres", "host": "postgres", "port": 5432, "login": "${POSTGRES_USER}", "password": "${POSTGRES_PASSWORD}", "schema": "${POSTGRES_DB}"}'
      # Used by the generator and dbt when Airflow runs them
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      DBT_PROFILES_DIR: /opt/project/dbt
      DBT_SEND_ANONYMOUS_USAGE_STATS: "false"
    volumes:
      - ./airflow/dags:/opt/airflow/dags
      - ./generator:/opt/project/generator:ro
      - ./dbt:/opt/project/dbt
    healthcheck:
      test: ["CMD", "curl", "-fs", "http://localhost:8080/api/v2/monitor/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 90s
    restart: unless-stopped

volumes:
  pgdata:
