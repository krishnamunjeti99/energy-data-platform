services:
  postgres:
    image: postgres:16
    container_name: energy_pg
    # Store and display timestamps in India time by default
    command: ["postgres", "-c", "timezone=Asia/Kolkata"]
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Run on demand:  docker compose run --rm generator --days 30
  generator:
    build: ./generator
    profiles: ["tools"]          # not started by a plain `docker compose up`
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      POSTGRES_HOST: postgres    # the service name on the compose network
      POSTGRES_PORT: "5432"      # container-to-container port, not the host port
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}

  # Run on demand:  docker compose run --rm dbt build
  dbt:
    build: ./dbt
    profiles: ["tools"]
    depends_on:
      postgres:
        condition: service_healthy
    # run as your WSL user so files dbt writes (target/, logs/) stay editable
    user: "${HOST_UID:-1000}:${HOST_GID:-1000}"
    working_dir: /usr/app
    volumes:
      - ./dbt:/usr/app
    ports:
      - "${DBT_DOCS_PORT:-8080}:8080"   # only used by `dbt docs serve`
    environment:
      DBT_PROFILES_DIR: /usr/app
      DBT_SEND_ANONYMOUS_USAGE_STATS: "false"
      HOME: /tmp
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}

  # Long-running web app:  docker compose up -d dashboard  ->  http://localhost:8501
  dashboard:
    build: ./dashboard
    container_name: energy_dashboard
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "${DASHBOARD_PORT:-8501}:8501"
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    restart: unless-stopped

volumes:
  pgdata:
